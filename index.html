<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>FitTrack - Rutinas de Ejercicio & Control de Peso</title>
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Redirección automática a la landing page en GitHub Pages -->
    <script>
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var basePath = window.location.pathname.replace(/\/+$/, '');
        window.location.replace(window.location.origin + basePath + '/docs/');
      }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans (Athletic & Tech-forward) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FitTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
